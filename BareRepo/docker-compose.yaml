version: "3.9"

services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    environment:
      - COLLECTOR_PORT=50051
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    expose:
      - "50051"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - COLLECTOR_ADDR=collector:50051
    depends_on:
      - collector
