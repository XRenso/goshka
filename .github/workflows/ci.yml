name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  detect-changes:
    name: Detect changed tasks
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed task folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            GitCliTool:
              - 'GitCliTool/**'
            BareRepo:
              - 'BareRepo/**'

  test-GitCliTool:
    name: "Test Task 1 — GitCliTool"
    needs: detect-changes
    if: ${{ contains(needs.detect-changes.outputs.tasks, 'GitCliTool') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: GitCliTool/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pytest

      - name: Build GitCliTool binary
        working-directory: GitCliTool
        run: go build -o gitpeek .

      - name: Run Python tests
        working-directory: GitCliTool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest tests/ -v --tb=short

  test-BareRepo:
    name: "Test Task 2 — BareRepo"
    needs: detect-changes
    if: ${{ contains(needs.detect-changes.outputs.tasks, 'BareRepo') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: BareRepo/go.mod

      - name: Build collector
        working-directory: BareRepo
        run: go build ./collector/cmd

      - name: Build gateway
        working-directory: BareRepo
        run: go build ./gateway/cmd

      - name: Start services
        working-directory: BareRepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker compose up -d --build

      - name: Wait for gateway
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/swagger/index.html && echo "Gateway is up" && exit 0
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Gateway did not start in time" && exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pytest

      - name: Run Python tests
        working-directory: BareRepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest tests/ -v --tb=short

      - name: Stop services
        if: always()
        working-directory: BareRepo
        run: docker compose down
